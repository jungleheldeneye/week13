# routes.conf — Reverse Proxy 라우팅 규칙 (./server ... -c routes.conf)
#
# 형식:
#   route <경로 접두어> <백엔드 주소...> [strip]   경로가 접두어로 시작하면 백엔드들에 Round-Robin으로 전달
#   host  <호스트 이름> <백엔드 주소...> [strip]   Host 헤더가 같으면 전달 (경로 규칙보다 우선)
#   strip: 접두어를 떼고 전달 (/b1/echo → 백엔드에는 /echo)
#   여러 규칙이 맞으면 더 긴 접두어가 우선
#
# 시연: 백엔드 두 개를 먼저 띄운다
#   ./server -p 8001 -r demo/backend1 &
#   ./server -p 8002 -r demo/backend2 &

route /api/   127.0.0.1:8001 127.0.0.1:8002
route /b1/    127.0.0.1:8001 strip
host  api.local 127.0.0.1:8001 127.0.0.1:8002
