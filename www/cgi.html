<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>CGI 데모</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>CGI 데모</h1>
  <p>아래 링크는 파일을 보내는 게 아니라, 서버가 <code>www/cgi-bin/</code>의 스크립트를 <b>실행</b>해서 그 출력을 보여줍니다.</p>

  <h2>GET (쿼리 문자열)</h2>
  <form action="/cgi-bin/hello.sh" method="get">
    <input name="name" placeholder="이름"> <button>인사받기</button>
  </form>

  <h2>POST (폼 본문 → 표준 입력)</h2>
  <form action="/cgi-bin/post.sh" method="post">
    <input name="title" placeholder="제목"> <input name="memo" placeholder="메모"> <button>보내기</button>
  </form>

  <h2>그 밖의 예제</h2>
  <ul>
    <li><a href="/cgi-bin/hello.sh/extra/path?name=PATH_INFO">PATH_INFO 예제</a></li>
    <li><a href="/cgi-bin/env.sh">환경 변수 전체 보기</a></li>
    <li><a href="/cgi-bin/stream.sh">스트리밍 (1초마다 한 줄)</a></li>
    <li><a href="/cgi-bin/status.sh">Status 헤더 (418)</a> · <a href="/cgi-bin/status.sh?go">Location 헤더 (302)</a></li>
    <li><a href="/cgi-bin/slow.sh">시간 초과 → 504 (10초 대기)</a></li>
    <li><a href="/cgi-bin/bad.sh">잘못된 출력 → 502</a></li>
    <li><a href="/cgi-bin/noexec.txt">실행 권한 없음 → 403</a></li>
  </ul>
  <p><a href="/">처음으로</a></p>
</body>
</html>
